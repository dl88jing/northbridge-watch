[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "northbridge-watch"
version = "0.1.0"
description = "Agentic vision home monitor — OpenCV 5 + AWS (OpenCV AI Competition 2026)"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "Northbridge Team" }]
dependencies = [
  "opencv-python-headless==5.0.0.93",
  "numpy>=1.26",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.0",
]

[project.optional-dependencies]
aws = ["boto3>=1.34"]
dev = ["httpx>=0.27"]

[project.scripts]
northbridge-watch-demo = "scripts.run_demo:main"
northbridge-watch-api = "northbridge_watch.api.server:main"

[tool.setuptools.packages.find]
include = ["northbridge_watch*"]
