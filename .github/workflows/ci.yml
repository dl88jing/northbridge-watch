name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: pytest + one-command demo (OpenCV 5)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt pytest httpx
          pip install -e .
      - name: OpenCV version
        run: python -c "import cv2; print(cv2.__version__); assert cv2.__version__.startswith('5.')"
      - name: Unit + API + eval-regression tests
        run: python -m pytest -q
      - name: One-command demo (headless)
        run: ./demo.sh demo

  web:
    name: web UI build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
